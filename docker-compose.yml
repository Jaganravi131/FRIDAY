services:
  friday:
    build: .
    image: friday:latest
    container_name: friday
    ports:
      - "8000:8000"
    environment:
      # Pass any provider key you have; leave all unset for simulation mode.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FRIDAY_PROVIDER: ${FRIDAY_PROVIDER:-auto}
      FRIDAY_MODEL: ${FRIDAY_MODEL:-}
      FRIDAY_APPROVAL: ${FRIDAY_APPROVAL:-dangerous}
      FRIDAY_API_TOKEN: ${FRIDAY_API_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      # Named volumes keep the container unprivileged and writable out of the box.
      # To edit files from the host instead, replace the first line with:
      #   - ./workspace:/workspace
      - friday-workspace:/workspace
      - friday-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  friday-workspace:
  friday-data:
