name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check friday tests

      - name: Format check
        run: ruff format --check friday tests

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        env:
          FRIDAY_SIM_PACE: "0"
        run: |
          friday --version
          friday doctor
          friday tools | head -20
          friday run "what is 6 * 7"
